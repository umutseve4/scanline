name: pages

# Bu workflow yalnizca GitHub Pages repo uzerinde ACIK oldugunda yayinlar.
# Pages kapaliyken kirmizi olmaz; adim ozetine hangi ayarin acilmasi
# gerektigini yazip yesil biter. Yalnizca-kirmizi olabilen bir kontrol
# hicbir bilgi tasimaz.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.probe.outputs.pages_enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Yayin durumundan bagimsiz olarak her kosuda calisir: derleme
      # bozulursa bu is kirmizi olur ve gercek bir hatayi gizlemeyiz.
      - name: Build single-file HTML
        run: node tools/build-single-file.mjs

      - name: Probe GitHub Pages state
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            enabled=true
          else
            enabled=false
          fi
          echo "pages_enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "pages_enabled=$enabled"
          {
            echo "## Pages preflight"
            echo ""
            echo "- \`repos/$GITHUB_REPOSITORY/pages\` erisilebilir mi: **$enabled**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$enabled" != "true" ]; then
            {
              echo ""
              echo "### Pages KAPALI - yayin adimi atlandi"
              echo ""
              echo "Derleme basarili, yalnizca yayin hedefi eksik. Acmak icin:"
              echo ""
              echo "1. **Settings -> Pages**"
              echo "2. **Source**: \`GitHub Actions\`"
              echo "3. Bu workflow'u yeniden calistir (\`Run workflow\`)."
              echo ""
              echo "API cevabi:"
              echo ""
              echo '```'
              head -c 500 /tmp/pages.err || true
              echo ""
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=GitHub Pages kapali::Yayin atlandi. Settings -> Pages -> Source: GitHub Actions."
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build single-file HTML
        run: node tools/build-single-file.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
